---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.0.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          dist="dist"

          # Create the release
          gh release create "${tag}" \
            --repo dnsimple/dnsimple-cli-public \
            --title "${tag}" \
            --notes "See https://github.com/dnsimple/dnsimple-cli/releases/tag/${tag} for release notes."

          # Upload all release assets
          gh release upload "${tag}" \
            --repo dnsimple/dnsimple-cli-public \
            "${dist}"/*.tar.gz "${dist}"/*.zip "${dist}"/checksums.txt
