version: 2

project_name: dnsimple

builds:
  - main: ./cmd/dnsimple
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: dnsimple

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

brews:
  - repository:
      owner: dnsimple
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Match the dnsimple-release-bot GitHub App's bot identity so the
    # Contents API commit is created as the GitHub App identity and is
    # auto-signed by GitHub, satisfying the homebrew-tap branch protection
    # rule that requires verified signatures.
    commit_author:
      name: dnsimple-release-bot[bot]
      email: 274471231+dnsimple-release-bot[bot]@users.noreply.github.com
      use_github_app_token: true
    # Temporary: override download URLs to point to the public homebrew-tap repo
    # while dnsimple-cli is still private.
    url_template: "https://github.com/dnsimple/homebrew-tap/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    homepage: "https://dnsimple.com"
    description: "DNSimple command-line tool."
    license: "MIT"
